<!DOCTYPE html>
<html lang="en">

<title>Orange</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="theme-orange" data-fruit-key="orange">
<div class="bg-orb"></div>
<div class="bg-orb"></div>
<div class="bg-orb"></div>
<div class="confetti-container" id="confetti"></div>
<header>
  <h1>Orange</h1>
</header>
<main>
  <section class="fruit-page-header">
    <div class="page-top-bar" id="pageTopBar">
      <a href="index.html" class="back-link">← All fruits</a>
      <div id="stockStatus" class="status-pill status-out">OUT OF STOCK</div>
    </div>
    <div data-banner-id="2020969"></div>
<div data-banner-id="2020970"></div>
<div data-banner-id="2020970"></div>
<div data-banner-id="2020978"></div>
<div data-banner-id="2020979"></div>
    <div class="fruit-banner">
      <img id="fruitImage" class="fruit-thumb" src="img/orang.png" alt="Orange">
    </div>
    <div class="fruit-details">
      <div class="fruit-detail-title" id="fruitDetailName">Orange</div>
      <div class="fruit-detail-category" id="fruitDetailCategory">Orange Fruit</div>
    </div>
  </section>
  <section class="fruit-controls">
    <button class="gen-btn" id="generateButton">Get one now</button>
  </section>
  <div class="json-section" id="jsonSection" style="display:none">
    <div class="json-header">
      <span>⚙ JSON Output</span>
      <button class="copy-btn" id="copyButton">Copy</button>
    </div>
    <pre id="jsonOut"></pre>
  </div>
</main>

<div id="ad-placeholder"></div>
<div class="adblocker-modal" id="adblockerModal">
  <div class="adblocker-modal-content">
    <div class="warning-icon">🛑</div>

    <p>This website relies on ads to stay running. Please disable your ad blocker to continue enjoying our fruit selector.</p>
    <button class="adblocker-disable-btn" onclick="location.reload()">Reload After Disabling Ad Blocker</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fuckadblock@3.2.1/fuckadblock.min.js"></script>
